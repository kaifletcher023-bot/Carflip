<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14202b"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Car flip">
<title>Car flip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#e9edf1;--card:#fff;--tx:#14202b;--t2:#56626e;--bd:#d3dae1;--ac:#f4c20d;--act:#14202b;--ok:#17703a;--okb:#dff3e5;--bad:#a8261d;--badb:#fbe2df;--wn:#805200;--wnb:#fbefcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--card:#19222b;--tx:#e8edf2;--t2:#9aa7b3;--bd:#2b3743;--ok:#6fd08f;--okb:#17301f;--bad:#ff8f86;--badb:#3a1a18;--wn:#f0c14f;--wnb:#372b0d}}
:root[data-theme="dark"]{--bg:#0f151b;--card:#19222b;--tx:#e8edf2;--t2:#9aa7b3;--bd:#2b3743;--ok:#6fd08f;--okb:#17301f;--bad:#ff8f86;--badb:#3a1a18;--wn:#f0c14f;--wnb:#372b0d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:0 12px 32px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;background:var(--bg);padding:10px 0;margin-bottom:4px}
nav button{flex:1;padding:10px 0;border:1px solid var(--bd);background:var(--card);color:var(--t2);border-radius:8px;font:inherit;font-weight:600;font-size:14px}
nav button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
label{display:block;font-size:13px;color:var(--t2)}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin-top:3px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.r{display:flex;gap:8px;align-items:center}
.pri{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--act);font-weight:600;font-size:16px}
.sm{padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:14px}
.sm.sel{background:var(--tx);color:var(--bg)}
.plate{background:#f4c20d;color:#111;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:center;font-size:22px;border:2px solid #111;border-radius:6px}
.ban{display:flex;gap:8px;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:600;font-size:14px;background:var(--card);border:1px solid var(--bd)}
button.ban{width:100%;text-align:left;font:inherit;font-weight:600;cursor:pointer}
.m{background:var(--bg);border-radius:10px;padding:10px}.m b{display:block;font-size:24px;line-height:1.2}.m span{font-size:13px;color:var(--t2)}
.ok{background:var(--okb);color:var(--ok);border-color:transparent}.bad{background:var(--badb);color:var(--bad);border-color:transparent}.wn{background:var(--wnb);color:var(--wn);border-color:transparent}
.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}
small{color:var(--t2);font-size:12px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}
.lb{width:100%;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx);text-align:left;font:inherit;padding:10px 6px}
.sel2{background:var(--bg)}
.sh{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:none;border:0;color:var(--tx);font-weight:600;font-size:15px;text-align:left}
.ci{padding:10px 14px;border-top:1px solid var(--bd)}
.st-ok{background:var(--okb);color:var(--ok);font-weight:600}.st-issue{background:var(--badb);color:var(--bad);font-weight:600}.st-unsure{background:var(--wnb);color:var(--wn);font-weight:600}
</style></head>
<body><main>
<nav><button data-t="check">Check</button><button data-t="auction">Auction</button><button data-t="viewing">Viewing</button><button data-t="stock">In stock</button><button data-t="sold">Sold</button></nav>
<div id="app"></div></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>(n<0?'-':'')+'£'+Math.abs(Math.round(n)).toLocaleString('en-GB');
const def=()=>({v:2,lastBackup:0,cars:[],short:[],active:null,notes:{},chk:{},fuel:'Petrol',gear:'Manual',draft:{model:'',reg:'',note:'',ask:'',oth:150,sale:'',days:21,tgt:500,repairs:[]}});
let st=def(),tab='check',selId=0,open={s0:true},rmArm=0,slArm=0;
const migrate=o=>{o.v=o.v||1;if(o.v<2){o.short=o.short||[];o.active=null;o.draft=o.draft||def().draft;o.draft.note=o.draft.note||'';o.v=2}o.short=o.short||[];if(o.draft){o.draft.hammer=o.draft.hammer||'';o.draft.vatIndem=!!o.draft.vatIndem}(o.short||[]).forEach(x=>{if(x.draft){x.draft.hammer=x.draft.hammer||'';x.draft.vatIndem=!!x.draft.vatIndem}});return o};
const linkActive=()=>{const x=st.active&&st.short.find(y=>y.id===st.active);if(x){st.draft=x.draft;st.chk=x.chk;st.fuel=x.fuel;st.gear=x.gear}else st.active=null};
try{const s=localStorage.getItem('carflip.v1');if(s)st=migrate(Object.assign(def(),JSON.parse(s)));linkActive()}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const save=()=>{try{const x=st.active&&st.short.find(y=>y.id===st.active);if(x){x.draft=st.draft;x.chk=st.chk;x.fuel=st.fuel;x.gear=st.gear}localStorage.setItem('carflip.v1',JSON.stringify(st))}catch(err){}};
const WILSONS=[[0,199,110],[200,399,220],[400,599,242],[600,799,330],[800,999,353],[1000,1199,375],[1200,1399,392],[1400,1599,407],[1600,1799,423],[1800,1999,440],[2000,2199,473],[2200,2399,480],[2400,2599,486],[2600,2799,501],[2800,2999,507],[3000,3199,512],[3200,3399,518],[3400,3599,524],[3600,3799,531],[3800,3999,539],[4000,4199,550],[4200,4399,560],[4400,4599,570],[4600,4799,580],[4800,4999,590],[5000,5499,600],[5500,5999,611],[6000,6499,616],[6500,6999,638],[7000,7499,660],[7500,7999,682],[8000,8499,704],[8500,8999,726],[9000,9499,748],[9500,9999,770],[10000,10999,803],[11000,11999,847],[12000,12999,891],[13000,13999,935],[14000,14999,979],[15000,15999,1018],[16000,16999,1040],[17000,17999,1062],[18000,18999,1084],[19000,19999,1105],[20000,20999,1133],[21000,21999,1188],[22000,22999,1260],[23000,23999,1370],[24000,24999,1480],[25000,25999,1590],[26000,26999,1700],[27000,27999,1810],[28000,28999,1920],[29000,29999,2030],[30000,30999,2140]];
const indemFor=h=>{const b=WILSONS.find(r=>h>=r[0]&&h<=r[1]);return b?b[2]:null};
const mets=a=>`<div class="g2">${a.map(x=>`<div class="m"><span>${x[0]}</span><b${x[2]?` class="${x[2]}"`:''}>${x[1]}</b></div>`).join('')}</div>`;
const ban=(g,t)=>`<div class="ban ${g}">${t}</div>`;
const S=[
["Ask the seller",["Two keys available","Any accidents or known faults","!Happy for a cold start and proper test drive"]],
["History check",["!MOT mileage climbs consistently","Repeated MOT advisories","!Finance, write-off, stolen check clear"]],
["Documents",["!V5C in seller's name and address","!VIN on car matches V5C","Service history and MOT certificates","Evidence cambelt or chain done"]],
["Exterior",["Panel gaps and paint match","Rust: arches, sills, door bottoms","Dents, scratches, alloys","Glass and lights fine","Tyres matching, even wear, age"]],
["Interior",["Wear matches the mileage","Damp or smoke smell","Warning lights come on then clear","Electrics, air con and heater work","Seatbelts fine, no airbag light"]],
["Under the bonnet",["!Cold start: no smoke or rattles","!No milky residue under oil cap","Oil and coolant look right","No leaks","Underneath: no corrosion or damage"]],
["Test drive",["Starts and idles smoothly","Brakes: no pulling or judder","Steering straight, no knocking","No clunks over bumps","Pulls strongly, no hesitation"]]];
const F={Petrol:["No misfire or rough running","Turbo (if fitted): no whistle or blue smoke"],Diesel:["DPF, EGR and glow plug lights clear","No black or blue smoke under load"],Electric:["Battery health and range at full charge","Charging port and cable work"]};
const G={Manual:["Clutch bite point, no slipping","Gears shift cleanly, no crunch"],Automatic:["Selects every gear smoothly","No harsh jolt into Drive or Reverse"]};
const PAY=["Funds cleared in your account, not just a screenshot","Buyer's ID seen","Receipt signed with both names and the price","V5C keeper change done"];
const mk=(t,k)=>({k,w:t[0]==='!',t:t[0]==='!'?t.slice(1):t});
function secs(){const r=S.map((s,i)=>({k:'s'+i,n:s[0],it:s[1].map((t,j)=>mk(t,'s'+i+'-'+j))}));r.push({k:'f'+st.fuel,n:st.fuel+' checks',it:F[st.fuel].map((t,j)=>mk(t,'f'+st.fuel+j))});if(st.fuel!=='Electric')r.push({k:'g'+st.gear,n:st.gear+' gearbox',it:G[st.gear].map((t,j)=>mk(t,'g'+st.gear+j))});return r}
const ck=k=>st.chk[k]||(st.chk[k]={s:'',c:'',n:''});
function calc(d){const ask=+d.ask||0,oth=+d.oth||0,sale=+d.sale||0,days=+d.days||0,tgt=+d.tgt||0;const rep=d.repairs.reduce((s,r)=>s+r.a,0),buf=rep*1.1,hold=days*4,net=sale*.95,cost=ask+buf+oth+hold,profit=net-cost;return{ask,sale,rep,profit,roi:cost?profit/cost*100:0,pd:days?profit/days:0,max:net-buf-oth-hold-tgt}}
const days=c=>Math.max(1,Math.round(((c.soldTs||Date.now())-c.start)/864e5));
const cost=c=>c.bought+c.rep+c.other+days(c)*4;
const cur=c=>c.soldPrice!=null?c.soldPrice:c.offers.length?c.offers[c.offers.length-1][1]:c.listed;
const sCar=()=>st.cars.find(c=>c.id===selId&&c.soldPrice==null)||st.cars.find(c=>c.soldPrice==null);
const nf=(k,l)=>`<label>${l}<input data-d="${k}" type="number" inputmode="decimal" value="${esc(st.draft[k])}"></label>`;
function slCard(){if(!st.short.length)return '';return `<div class="card"><h2>Shortlist <small>${st.short.length} car${st.short.length>1?'s':''}</small></h2>${st.short.map(x=>{const c=calc(x.draft),v=!c.ask||!c.sale?'Needs prices':c.ask<=c.max?'Worth viewing':'Over by '+f(c.ask-c.max),k=!c.ask||!c.sale?'':c.ask<=c.max?'t-ok':'t-bad';return `<button class="lb${x.id===st.active?' sel2':''}" data-a="opensl" data-id="${x.id}"><b>${esc(x.draft.model||'Unnamed')}</b> <small>${esc(x.draft.reg||'')}</small><br><small>${c.ask?'Asking '+f(c.ask)+' · ':''}${c.sale?'Max bid '+f(c.max)+' · ':''}<span class="${k}">${v}</span></small></button>`}).join('')}</div>`}
function vAuction(){const d=st.draft;return `<div class="card"><h2>Auction out-the-door price</h2>
<label>Hammer price (£)<input data-d="hammer" type="number" inputmode="decimal" value="${esc(d.hammer)}" placeholder="3500"></label>
<label class="r" style="margin-top:8px;font-size:14px"><input type="checkbox" style="width:auto;margin:0" data-d="vatIndem" ${d.vatIndem?'checked':''}> Fees are also +VAT (check your invoice)</label>
<div id="auc"></div>
<button class="pri" data-a="useAuc" style="margin-top:10px">Use as asking price on Check tab</button>
<small style="display:block;margin-top:8px">Wilsons Auctions indemnity charges, entered by you. Assumes 20% VAT on the hammer price; tick above if the indemnity fee also carries VAT on your invoice. Bands only go up to £30,999 — check with the auction house above that.</small></div>`}
function vCheck(){const d=st.draft;return slCard()+`<div class="card"><h2>Deal check</h2>
<label>Reg plate<input class="plate" data-d="reg" value="${esc(d.reg)}" placeholder="AB16 CDE" autocapitalize="characters"></label>
<label style="margin:10px 0">Model<input data-d="model" value="${esc(d.model)}" placeholder="Ford Fiesta 1.0"></label>
<label style="margin-bottom:10px">Listing link, seller, notes<textarea data-d="note" rows="2" placeholder="Link, seller's number, what they said">${esc(d.note||'')}</textarea></label>
<div class="g2">${nf('ask','Asking or agreed price (£)')}${nf('oth','Other costs (£)')}${nf('sale','Expected sale (£)')}${nf('days','Days to sell')}${nf('tgt','Target profit (£)')}</div></div>
<div class="card"><h2>Repairs <span id="reptot"></span></h2><div id="replist"></div><div class="r" style="margin-top:8px"><input id="rn" placeholder="Clutch"><input id="ra" type="number" inputmode="numeric" placeholder="£" style="width:90px"><button class="sm" data-a="addrep" aria-label="Add repair">+</button></div><small id="rerr" class="t-bad"></small></div>
<div id="res"></div>${st.active?'<small>On your shortlist. Changes save automatically.</small>':'<button class="sm" data-a="saveSl" style="width:100%;margin-bottom:8px">Save to shortlist</button>'}
<button class="pri" data-a="buy" style="margin-top:8px">Bought it: add to In stock</button><small id="berr" class="t-bad"></small>
<div class="r" style="margin-top:12px"><button class="sm" data-a="newdeal">New deal</button>${st.active?`<button class="sm" data-a="rmsl">${slArm===st.active?'Tap again to remove':'Remove from shortlist'}</button>`:''}</div>`}
function updAuc(){const d=st.draft,h=+d.hammer||0,e=$('#auc');if(!e)return;
if(!h){e.innerHTML='<small>Enter the hammer price to work out fees.</small>';return}
const idm=indemFor(h);
if(idm==null){e.innerHTML=ban('wn','No banded fee above £30,999 in this table. Ask the auction house for the charge on this lot.');return}
const vatH=h*.2,vatI=d.vatIndem?idm*.2:0,total=h+vatH+idm+vatI;
e.innerHTML=mets([['Indemnity charge',f(idm)],['VAT on hammer (20%)',f(vatH)],['VAT on indemnity',d.vatIndem?f(vatI):'—'],['Out-the-door total',f(total),'t-bad']])}
function updCheck(){if(!$('#res'))return;const d=st.draft,c=calc(d);
$('#reptot').textContent=f(c.rep);
$('#replist').innerHTML=d.repairs.length?d.repairs.map((r,i)=>`<div class="li"><span>${esc(r.n)}</span><span>${f(r.a)} <button class="sm" data-a="delrep" data-i="${i}" aria-label="Remove ${esc(r.n)}">×</button></span></div>`).join(''):'<small>No repairs yet. Add each job with its cost.</small>';
$('#res').innerHTML=(!c.ask||!c.sale)?ban('wn','Enter the asking price and expected sale price to see the verdict.'):(c.ask<=c.max?ban('ok',`Asking price is ${f(c.max-c.ask)} under your max bid. Worth viewing.`):ban('bad',`Asking price is ${f(c.ask-c.max)} over your max bid. Offer ${f(c.max)} or walk away.`))+mets([['Profit',f(c.profit),c.profit>=0?'t-ok':'t-bad'],['ROI',c.roi.toFixed(1)+'%'],['Profit per day',f(c.pd)],['Max bid',f(c.max)]])+'<small>Assumes a 5% haggle off the sale price, a 10% repair buffer and £4 a day holding cost.</small>'}
function vView(){const d=st.draft,ns=st.notes[d.model||'_']||'';
let h=`<div class="card"><h2>${esc(d.model||'No model set')} <small>${esc(d.reg)}</small></h2>
${st.short.length?`<label style="margin-bottom:10px">Switch car<select id="sw">${st.active?'':'<option value="0" selected>Unsaved deal</option>'}${st.short.map(x=>`<option value="${x.id}"${x.id===st.active?' selected':''}>${esc(x.draft.model||'Unnamed')} ${esc(x.draft.reg||'')}</option>`).join('')}</select></label>`:''}
<label>Fuel</label><div class="r" style="margin:4px 0 10px">${Object.keys(F).map(k=>`<button class="sm${k===st.fuel?' sel':''}" data-a="fuel" data-v="${k}">${k}</button>`).join('')}</div>
<label>Gearbox</label><div class="r" style="margin:4px 0 10px">${st.fuel==='Electric'?'<small>Not needed for electric cars.</small>':Object.keys(G).map(k=>`<button class="sm${k===st.gear?' sel':''}" data-a="gear" data-v="${k}">${k}</button>`).join('')}</div>
<label>Known problems for this model<textarea data-note rows="2" placeholder="Faults you've learned to look for">${esc(ns)}</textarea></label></div><div id="csum"></div>`;
secs().forEach(s=>{const dn=s.it.filter(i=>ck(i.k).s).length,is=s.it.filter(i=>ck(i.k).s==='issue').length;
h+=`<div class="card" style="padding:0"><button class="sh" data-a="sec" data-v="${s.k}"><span>${s.n}</span><span>${is?`<span class="t-bad">${is} issue${is>1?'s':''} · </span>`:''}${dn}/${s.it.length} ${open[s.k]?'▲':'▼'}</span></button>`;
if(open[s.k])s.it.forEach(i=>{const c=ck(i.k);h+=`<div class="ci"><div>${esc(i.t)}${i.w?' <small class="t-bad">Walk-away</small>':''}</div><div class="r" style="margin-top:6px">${['ok','issue','unsure'].map(v=>`<button class="sm ${c.s===v?'st-'+v:''}" data-a="set" data-k="${i.k}" data-v="${v}">${v==='ok'?'OK':v==='issue'?'Issue':'Unsure'}</button>`).join('')}</div>${c.s==='issue'||c.s==='unsure'?`<div class="r" style="margin-top:6px"><input data-n="${i.k}" placeholder="${c.s==='issue'?"What's wrong?":'What are you unsure about?'}" value="${esc(c.n)}">${c.s==='issue'?`<input data-c="${i.k}" type="number" inputmode="numeric" placeholder="£ fix" style="width:90px" value="${esc(c.c)}">`:''}</div>`:''}</div>`});
h+='</div>'});
return h+`<button class="pri" data-a="chk2rep">Add issues to repair list</button><p id="cmsg"></p><button class="sm" data-a="rstchk">Clear checklist for next car</button>`}
function updChk(){const all=secs().flatMap(s=>s.it),iss=all.filter(i=>ck(i.k).s==='issue'),dn=all.filter(i=>ck(i.k).s).length,tot=iss.reduce((s,i)=>s+(+ck(i.k).c||0),0),w=iss.find(i=>i.w);
$('#csum').innerHTML=(w?ban('bad',`Walk-away flag: ${esc(w.t)}. Don't buy unless the seller resolves it.`):iss.length?ban('wn',`${iss.length} issue${iss.length>1?'s':''} found. Add fix costs, then send them to your repair list.`):dn===all.length?ban('ok','All checks passed with no issues.'):ban('','Open a section and tap OK, Issue or Unsure on each check.'))+mets([['Checked',dn+'/'+all.length],['Issues',iss.length],['Fix costs',f(tot)]])}
function vStock(){const L=st.cars.filter(c=>c.soldPrice==null);if(!L.length)return '<div class="card"><h2>In stock</h2><small>No cars yet. Run a deal on the Check tab, then tap "Bought it".</small></div>';
const c=sCar();selId=c.id;const nfc=(k,l)=>`<label>${l}<input type="number" inputmode="numeric" data-cf="${k}" value="${c[k]}"></label>`;
return `<div class="card"><h2>In stock <small>${L.length} car${L.length>1?'s':''}</small></h2>${L.map(x=>`<button class="lb${x.id===c.id?' sel2':''}" data-a="sel" data-id="${x.id}"><b>${esc(x.model)}</b><br><small>${esc(x.reg)} · ${days(x)} days · ${f(cost(x))} in</small></button>`).join('')}</div>
<div class="card"><h2>${esc(c.model)} <small>${esc(c.reg)}</small></h2>
<div class="g2">${nfc('bought','Bought (£)')}${nfc('rep','Repairs so far (£)')}${nfc('other','Other costs (£)')}${nfc('listed','Listed price (£)')}${nfc('target','Target profit (£)')}</div><small>Repairs you estimated when you bought: ${f(c.repEst)}</small>
<h2 style="margin-top:14px">Offers</h2>${c.offers.map(o=>`<div class="li"><span>${o[0]} ${f(o[1])}</span><span class="${o[1]-cost(c)>=c.target?'t-ok':'t-bad'}">${f(o[1]-cost(c))} profit</span></div>`).join('')||'<small>No offers yet.</small>'}
<div class="r" style="margin-top:8px"><select id="ow" style="width:auto"><option>Buyer offer</option><option>Your counter</option></select><input id="oa" type="number" inputmode="numeric" placeholder="£"><button class="sm" data-a="offer">Log</button></div><small id="oerr" class="t-bad"></small>
<div id="cd" style="margin-top:12px"></div>
<h2>Before you hand over the keys</h2>${PAY.map((p,i)=>`<label class="r" style="font-size:15px;color:var(--tx);margin:6px 0"><input type="checkbox" style="width:auto;margin:0" data-pay="${i}" ${c.pay[i]?'checked':''}>${p}</label>`).join('')}<div id="pw"></div>
<button class="pri" data-a="sold" style="margin:10px 0">Mark sold</button>
<button class="sm" data-a="rm">${rmArm===c.id?'Tap again to remove this car':'Remove car'}</button></div>`}
function updCar(){const c=sCar();if(!c||!$('#cd'))return;const k=cost(c),fl=k+c.target,cu=cur(c),p=cu-k;
$('#cd').innerHTML=(cu>=fl?ban('ok',`${f(cu-fl)} above your lowest price. Profit ${f(p)}.`):ban('bad',`${f(fl-cu)} below your lowest price. Counter at ${f(fl)} or more.`))+mets([['Profit at '+f(cu),f(p),p>=0?'t-ok':'t-bad'],['Lowest you\'d accept',f(fl)]])+`<small>Total cost ${f(k)} including £4 a day holding.</small>`;
$('#pw').innerHTML=c.pay.every(Boolean)?'':'<small>Not all payment checks ticked yet.</small>'}
function vSold(){const L=st.cars.filter(c=>c.soldPrice!=null).sort((a,b)=>b.soldTs-a.soldTs),pr=c=>c.soldPrice-cost(c);let h='';
if(L.length){const t=L.reduce((s,c)=>s+pr(c),0),d=L.reduce((s,c)=>s+days(c),0)/L.length,o=L.reduce((s,c)=>s+c.rep-c.repEst,0)/L.length;
h+=mets([['Total profit',f(t),t>=0?'t-ok':'t-bad'],['Cars sold',L.length],['Avg profit per car',f(t/L.length)],['Avg days to sell',Math.round(d)]])+ban(o>0?'wn':'ok',o>0?`Your repair estimates ran ${f(o)} under the real cost per car on average.`:'Your repair estimates are at or under real costs on average.')+'<div class="card">'+L.map(c=>`<div class="li"><span><b>${esc(c.model)}</b><br><small>${esc(c.reg)} · ${f(c.bought)} → ${f(c.soldPrice)} · ${days(c)} days<br>Repairs: est ${f(c.repEst)}, actual ${f(c.rep)}</small></span><b class="${pr(c)>=0?'t-ok':'t-bad'}">${f(pr(c))}</b></div>`).join('')+'</div>'}
else h+='<div class="card"><small>Sold cars appear here with profit and days to sell.</small></div>';
return h+`<div class="card"><h2>Backup</h2><small>Your data lives in this browser only. Download a backup now and then and keep it somewhere safe.</small><div class="r" style="margin:8px 0"><button class="sm" data-a="dl">Download backup file</button><button class="sm" data-a="bk">Show as text</button></div><small>${st.lastBackup?'Last backup: '+new Date(st.lastBackup).toLocaleDateString('en-GB'):'No backup yet.'}</small><textarea id="bkt" rows="3" readonly placeholder="Backup appears here. Select all and copy."></textarea><label style="margin-top:8px">Restore: paste a backup here<textarea id="rst" rows="3"></textarea></label><label style="margin-top:8px">Or restore from a backup file<input type="file" id="rf" accept=".json,application/json"></label><div class="r" style="margin-top:8px"><button class="sm" data-a="rs">Restore</button></div><small id="bmsg"></small></div>`}
function autoSave(){if(!st.active&&(st.draft.model.trim()||+st.draft.ask))st.short.push({id:Date.now(),draft:st.draft,chk:st.chk,fuel:st.fuel,gear:st.gear})}
function openDeal(id){save();autoSave();const x=st.short.find(y=>y.id===id);if(!x)return;st.active=id;st.draft=x.draft;st.chk=x.chk;st.fuel=x.fuel;st.gear=x.gear;save()}
function newDeal(){save();autoSave();const n=def();st.active=null;st.draft=n.draft;st.chk={};st.fuel='Petrol';st.gear='Manual';save()}
function bkNote(){if(!st.cars.length&&!st.short.length)return '';const d=st.lastBackup?Math.floor((Date.now()-st.lastBackup)/864e5):-1;if(d>=0&&d<7)return '';return '<button class="ban wn" data-a="gosold">'+(d<0?"You haven't backed up yet.":'Last backup was '+d+' days ago.')+' Tap to back up.</button>'}
function doRestore(t){try{const o=JSON.parse(t);if(!o||!Array.isArray(o.cars))throw 0;st=migrate(Object.assign(def(),o));linkActive();save();render();$('#bmsg').textContent='Restored.'}catch(x){const m=$('#bmsg');if(m)m.textContent='That backup could not be read. Use the full file or text you saved.'}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));app.innerHTML=(tab!=='sold'?bkNote():'')+{check:vCheck,auction:vAuction,viewing:vView,stock:vStock,sold:vSold}[tab]();if(tab==='check')updCheck();if(tab==='auction')updAuc();if(tab==='viewing')updChk();if(tab==='stock')updCar()}
const msg=(t,c)=>{const e=$('#cmsg');if(e){e.textContent=t;e.className=c}};
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const v=b.dataset.v;
switch(b.dataset.a){
case'useAuc':{const h=+st.draft.hammer||0,idm=indemFor(h);if(!h||idm==null){return}const total=h+h*.2+idm+(st.draft.vatIndem?idm*.2:0);st.draft.ask=String(Math.round(total*100)/100);save();tab='check';render();window.scrollTo(0,0);return}
case'addrep':{const n=$('#rn').value.trim(),a=parseFloat($('#ra').value);if(!n||!(a>=0)){$('#rerr').textContent='Enter a repair name and amount first.';return}st.draft.repairs.push({n,a});$('#rn').value='';$('#ra').value='';$('#rerr').textContent='';save();updCheck();return}
case'delrep':st.draft.repairs.splice(+b.dataset.i,1);save();updCheck();return;
case'buy':{const d=st.draft,c=calc(d);if(!d.model.trim()||!c.ask){$('#berr').textContent='Add the model and asking price first.';return}
const car={id:Date.now(),model:d.model.trim(),reg:d.reg.trim().toUpperCase(),bought:c.ask,repEst:c.rep,rep:c.rep,other:+d.oth||0,listed:c.sale,target:+d.tgt||0,start:Date.now(),offers:[],soldPrice:null,soldTs:null,pay:[false,false,false,false]};
st.cars.push(car);if(st.active){st.short=st.short.filter(x=>x.id!==st.active);st.active=null}const nd=def();st.draft=nd.draft;st.chk={};st.fuel='Petrol';st.gear='Manual';selId=car.id;save();tab='stock';render();return}
case'saveSl':{if(!st.draft.model.trim()){$('#berr').textContent='Add the model first.';return}const x={id:Date.now(),draft:st.draft,chk:st.chk,fuel:st.fuel,gear:st.gear};st.short.push(x);st.active=x.id;save();render();return}
case'newdeal':newDeal();render();window.scrollTo(0,0);return;
case'opensl':openDeal(+b.dataset.id);render();return;
case'rmsl':{if(slArm===st.active){st.short=st.short.filter(x=>x.id!==st.active);st.active=null;const n=def();st.draft=n.draft;st.chk={};st.fuel='Petrol';st.gear='Manual';slArm=0;save()}else slArm=st.active;render();return}
case'sec':open[v]=!open[v];render();return;
case'fuel':st.fuel=v;save();render();return;
case'gear':st.gear=v;save();render();return;
case'set':{const c=ck(b.dataset.k);c.s=c.s===v?'':v;save();render();return}
case'rstchk':st.chk={};save();render();return;
case'chk2rep':{const ls=secs().flatMap(s=>s.it).filter(i=>ck(i.k).s==='issue'&&!ck(i.k).sent&&(+ck(i.k).c||0)>0);if(!ls.length){msg('Mark an issue and enter its fix cost first.','t-bad');return}
ls.forEach(i=>{const c=ck(i.k);c.sent=true;st.draft.repairs.push({n:i.t+(c.n?': '+c.n:''),a:+c.c})});save();tab='check';render();return}
case'sel':selId=+b.dataset.id;rmArm=0;render();return;
case'offer':{const c=sCar(),a=parseFloat($('#oa').value);if(!(a>0)){$('#oerr').textContent='Enter an offer amount first.';return}c.offers.push([$('#ow').value,a]);save();render();return}
case'sold':{const c=sCar();c.soldPrice=cur(c);c.soldTs=Date.now();save();render();return}
case'rm':{const c=sCar();if(rmArm===c.id){st.cars=st.cars.filter(x=>x.id!==c.id);rmArm=0;save()}else rmArm=c.id;render();return}
case'bk':st.lastBackup=Date.now();save();$('#bkt').value=JSON.stringify(st);$('#bkt').select();return;
case'rs':doRestore($('#rst').value);return;
case'dl':{st.lastBackup=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st)],{type:'application/json'}));a.download='carflip-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();render();return}
case'gosold':tab='sold';render();window.scrollTo(0,0);return}});
app.addEventListener('input',e=>{const t=e.target,d=t.dataset;
if(d.d!==undefined){st.draft[d.d]=t.type==='checkbox'?t.checked:t.value;save();if(tab==='auction')updAuc();else updCheck()}
else if(d.c!==undefined){ck(d.c).c=t.value;save();updChk()}
else if(d.n!==undefined){ck(d.n).n=t.value;save()}
else if(d.cf!==undefined){sCar()[d.cf]=+t.value||0;save();updCar()}
else if(d.note!==undefined){st.notes[st.draft.model||'_']=t.value;save()}});
app.addEventListener('change',e=>{const t=e.target;if(t.id==='sw'){if(+t.value)openDeal(+t.value);render();return}if(t.id==='rf'){const fl=t.files[0];if(fl)fl.text().then(doRestore);return}const p=t.dataset.pay;if(p!==undefined){sCar().pay[+p]=t.checked;save();updCar()}});
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;rmArm=0;slArm=0;render();window.scrollTo(0,0)});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
