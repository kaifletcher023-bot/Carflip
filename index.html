<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:0 14px 40px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;background:var(--bg);padding:10px 0 12px;margin-bottom:6px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border:1.5px solid var(--bd);background:var(--card);color:var(--t2);border-radius:12px;font:inherit;font-weight:600;font-size:10.5px}
nav button svg{width:19px;height:19px}
nav button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:18px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;letter-spacing:-.01em}
label{display:block;font-size:13px;color:var(--t2)}
input,select,textarea,button{font:inherit}

input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(244,194,13,.28)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.r{display:flex;gap:8px;align-items:center}
.pri{width:100%;padding:15px;border:0;border-radius:12px;background:var(--ac);color:var(--act);font-weight:600;font-size:16px;transition:transform .1s}
.pri:active{transform:scale(.98)}
.pri:disabled{opacity:.5}
.sm{padding:9px 14px;border:1.5px solid var(--bd);border-radius:11px;background:var(--card);color:var(--tx);font-size:14px;font-weight:500;transition:transform .1s}
.sm:active{transform:scale(.97)}
.sm.sel{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.plate{background:#f4c20d;color:#111;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:center;font-size:22px;border:2px solid #111;border-radius:8px}
.ban{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:12px;margin-bottom:14px;font-weight:600;font-size:14px;line-height:1.4;background:var(--card);border:1px solid var(--bd)}
.ban svg{width:19px;height:19px;flex-shrink:0;margin-top:1px}
.m{background:var(--bg);border-radius:12px;padding:13px 14px}.m b{display:block;font-size:25px;line-height:1.2;letter-spacing:-.01em}.m span{font-size:12.5px;color:var(--t2)}
.ok{background:var(--okb);color:var(--ok);border-color:transparent}.bad{background:var(--badb);color:var(--bad);border-color:transparent}.wn{background:var(--wnb);color:var(--wn);border-color:transparent}
.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}.t-wn{color:var(--wn)}
small{color:var(--t2);font-size:12.5px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd);font-size:15px}
.lb{width:100%;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx);text-align:left;font:inherit;padding:14px 8px;border-radius:8px;transition:background .1s}
.lb:active{background:var(--bg)}
.sel2{background:var(--bg)}
.sh{width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 16px;background:none;border:0;color:var(--tx);font-weight:600;font-size:15.5px;text-align:left}
.ci{padding:13px 16px 15px;border-top:1px solid var(--bd)}
.dd{border:1.5px solid var(--bd);border-radius:12px;margin-top:10px;overflow:hidden}
.st-ok{background:var(--okb);color:var(--ok);font-weight:600;border-color:transparent}.st-issue{background:var(--badb);color:var(--bad);font-weight:600;border-color:transparent}.st-unsure{background:var(--wnb);color:var(--wn);font-weight:600;border-color:transparent}
#gate{max-width:340px;margin:64px auto;text-align:center}
#gate svg{width:34px;height:34px;color:var(--ac);margin-bottom:6px}
.savepill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;font-size:12px;padding:5px 11px;border-radius:20px;background:var(--card);border:1px solid var(--bd);color:var(--t2);z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.savepill.saving{color:var(--wn)}.savepill.saved{color:var(--ok)}.savepill.error{color:var(--bad)}
</style></head>
<body>

<div id="gate" class="card">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l1.5-6.5A2 2 0 017.4 8h9.2a2 2 0 011.9 1.5L20 16"/><rect x="3" y="16" width="18" height="4" rx="1.5"/><circle cx="7.5" cy="20" r="1.4"/><circle cx="16.5" cy="20" r="1.4"/></svg>

<button data-t="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><path d="M19 19l-4.3-4.3"/></svg><span>Check</span></button>
<button data-t="auction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l6 6"/><rect x="2.5" y="7.5" width="8" height="4" rx="1" transform="rotate(-45 6.5 9.5)"/><path d="M4 15l5-5"/><path d="M3 21h9"/><path d="M15 5l4 4"/></svg><span>Auction</span></button>

<button data-t="viewing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6a1 1 0 011 1v1H8V4a1 1 0 011-1z"/><path d="M8.5 12.5l2 2 4-4.5"/><path d="M8.5 17h7"/></svg><span>Viewing</span></button>
<button data-t="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l1.5-6.5A2 2 0 017.4 8h9.2a2 2 0 011.9 1.5L20 16"/><rect x="3" y="16" width="18" height="4" rx="1.5"/><circle cx="7.5" cy="20" r="1.4"/><circle cx="16.5" cy="20" r="1.4"/></svg><span>In stock</span></button>
<button data-t="sold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 7-9 9-7-7 9-9z"/><circle cx="9.3" cy="8.7" r="1.4"/><path d="M4 13V6a1 1 0 011-1h7"/></svg><span>Sold</span></button>
</nav>
<div id="app"></div>
</main>
<script type="module">

const indemFor=h=>{const b=WILSONS.find(r=>h>=r[0]&&h<=r[1]);if(b)return b[2];if(h>31999)return 1120+40*(Math.floor((h-32000)/1000)+1);return null};

const ban=(g,t)=>`<div class="ban ${g}">${BANICON[g]||BANICON['']}<span>${t}</span></div>`;
const S=[
["Ask the seller",["Two keys available","Any accidents or known faults","!Happy for a cold start and proper test drive"]],
["History check",["!MOT mileage climbs consistently","Repeated MOT advisories","!Finance, write-off, stolen check clear"]],

const F={Petrol:["No misfire or rough running","Turbo (if fitted): no whistle or blue smoke"],Diesel:["DPF, EGR and glow plug lights clear","No black or blue smoke under load"],Electric:["Battery health and range at full charge","Charging port and cable work"]};
const G={Manual:["Clutch bite point, no slipping","Gears shift cleanly, no crunch"],Automatic:["Selects every gear smoothly","No harsh jolt into Drive or Reverse"]};

const mk=(t,k)=>({k,w:t[0]==='!',t:t[0]==='!'?t.slice(1):t});
function secs(){const r=S.map((s,i)=>({k:'s'+i,n:s[0],it:s[1].map((t,j)=>mk(t,'s'+i+'-'+j))}));r.push({k:'f'+st.fuel,n:st.fuel+' checks',it:F[st.fuel].map((t,j)=>mk(t,'f'+st.fuel+j))});if(st.fuel!=='Electric')r.push({k:'g'+st.gear,n:st.gear+' gearbox',it:G[st.gear].map((t,j)=>mk(t,'g'+st.gear+j))});return r}
const ck=k=>st.chk[k]||(st.chk[k]={s:'',c:'',n:''});
function calc(d){const ask=+d.ask||0,fees=+d.oth||0,sale=+d.sale||0,tgt=+d.tgt||0;const rep=d.repairs.reduce((s,r)=>s+r.a,0),buf=rep*1.1,net=sale*.95,cost=ask+buf+fees,profit=net-cost;return{ask,sale,rep,fees,otd:ask+fees,profit,roi:cost?profit/cost*100:0,max:net-buf-fees-tgt}}
const daysHeld=c=>Math.max(1,Math.round(((c.soldTs||Date.now())-c.start)/864e5));
const costOf=c=>c.bought+c.rep+c.other+daysHeld(c)*4;

const sCar=()=>st.cars.find(c=>c.id===selId&&c.soldPrice==null)||st.cars.find(c=>c.soldPrice==null);
const nf=(k,l)=>`<label>${l}<input data-d="${k}" type="number" inputmode="decimal" value="${esc(st.draft[k])}"></label>`;
const ADVISORY_RULES=[
  [/\bhas (?:a |an )?(?:minor |major )?leaks? of [\w\s]+/i,'leak'],
  [/\bhas (?:a |an )?(?:minor |major )?leaks?\b.*/i,'leak'],
  [/\b(?:slightly )?damaged\/cracking or perishing.*/i,'damaged/cracking'],
  [/\bworn close to (?:the )?legal limit.*/i,'worn'],
  [/\bworn on edge.*/i,'worn'],
  [/\bbelow requirements\b.*/i,'low'],
  [/\bfractured or broken.*/i,'broken'],
  [/\binoperative.*/i,''],
  [/\bnot working.*/i,''],
  [/\bdefective\b.*/i,''],
  [/\bfluctuating.*/i,'fluctuating'],
  [/\bexcessively damaged or deteriorated.*/i,'damaged'],
  [/\bcorroded\b.*/i,'corroded'],
  [/\binsecure\b.*/i,'loose'],
  [/\bmissing\b.*/i,'missing'],
];
function shortAdvisory(raw){
  let t=String(raw).split(/\(\d+\.\d+/)[0].trim();
  for(const[re,repl] of ADVISORY_RULES){if(re.test(t)){t=t.replace(re,repl);break}}
  return t.replace(/[\s,]+$/,'').trim();
}
function slCard(){if(!st.short.length)return '';return `<div class="card"><h2>Shortlist <small>${st.short.length} car${st.short.length>1?'s':''}</small></h2>${st.short.map(x=>{const c=calc(x.draft),v=!c.ask||!c.sale?'Needs prices':c.ask<=c.max?'Worth viewing':'Over by '+f(c.ask-c.max),k=!c.ask||!c.sale?'':c.ask<=c.max?'t-ok':'t-bad';return `<button class="lb${x.id===st.active?' sel2':''}" data-a="opensl" data-id="${x.id}"><b>${esc(x.draft.model||'Unnamed')}</b> <small>${esc(x.draft.reg||'')}</small>${x.source==='alert'?' <small class="t-ok">from alert</small>':''}<br><small>${c.ask?'Asking '+f(c.ask)+' · ':''}${c.sale?'Max bid '+f(c.max)+' · ':''}<span class="${k}">${v}</span></small></button>`}).join('')}</div>`}
function vAuction(){const d=st.draft;return `<div class="card"><h2>Auction out-the-door price</h2>
<label>Hammer price (£)<input data-d="hammer" type="number" inputmode="decimal" value="${esc(d.hammer)}" placeholder="3500"></label>
<label class="r" style="margin-top:8px;font-size:14px"><input type="checkbox" style="width:auto;margin:0" data-d="vatIndem" ${d.vatIndem?'checked':''}> Fees are also +VAT (check your invoice)</label>

function vCheck(){const d=st.draft;return slCard()+`<div class="card"><h2>Deal check</h2>
<label>Reg plate<div class="r"><input class="plate" data-d="reg" value="${esc(d.reg)}" placeholder="AB16 CDE" autocapitalize="characters" style="flex:1"></div></label>
<button class="sm" data-a="lookup" style="width:100%;margin-top:8px">${lookupBusy?'Looking up…':'Look up this reg (DVLA + MOT)'}</button>

<div class="g2">${nf('ask','Asking or agreed price (£)')}${nf('sale','Expected sale (£)')}${nf('oth','Auction fees (£)')}${nf('tgt','Target profit (£)')}</div><small>Auction fees fill in automatically when you use the Auction tab, or type your own.</small><div id="otd" style="margin-top:10px"></div></div>
<div class="card"><h2>Repairs <span id="reptot"></span></h2><div id="replist"></div><div class="r" style="margin-top:8px"><input id="rn" placeholder="Clutch"><input id="ra" type="number" inputmode="numeric" placeholder="£" style="width:90px"><button class="sm" data-a="addrep" aria-label="Add repair">+</button></div><div class="r" style="margin-top:8px"><button class="sm" data-a="adddelivery">+ Delivery (£80)</button></div><small id="rerr" class="t-bad"></small></div>

function updAuc(){const d=st.draft,h=+d.hammer||0,e=$('#auc');if(!e)return;

function miAnalyse(list){
  const rs=(list||[]).filter(r=>r&&r.date&&Number.isFinite(r.miles)).map(r=>({...r,t:new Date(r.date).getTime()})).filter(r=>!isNaN(r.t)).sort((a,b)=>b.t-a.t);

    return {...r,delta,days,perYear};
  });
  const rates=rows.filter(r=>r.perYear!=null&&r.days>=300&&r.delta>=0).map(r=>r.perYear).sort((a,b)=>a-b);
  const med=rates.length>=3?(rates.length%2?rates[(rates.length-1)/2]:(rates[rates.length/2-1]+rates[rates.length/2])/2):null;
  rows.forEach(r=>{
    r.flag=null;
    if(r.delta!=null&&r.delta<0)r.flag='drop';
    else if(med!=null&&r.perYear!=null&&r.days>=300){
      if(r.perYear<med*0.25)r.flag='low';
      else if(r.perYear>med*2)r.flag='high';
    }
  });
  return rows;
}
function miSection(m){

  const prov=String(m.issues||'').toLowerCase()==='yes'||!!m.issueDescription;

  const nf=n=>Number(n).toLocaleString('en-GB');

  let html=kv('Last recorded',m.lastRecorded!=null?nf(m.lastRecorded)+' miles':null)

    +kv('Provider mileage check',prov?'Issue: '+(m.issueDescription||'flagged'):'No issues',prov?'t-bad':'');
  if(rows.length){

    html+=rows.map(r=>{

      let sub='';
      if(r.delta!=null){
        if(r.delta<0)sub=`<br><small class="t-bad">${nf(Math.abs(r.delta))} fewer than the previous reading</small>`;
        else{
          const cls=r.flag?'t-wn':'';
          sub=`<br><small class="${cls}">+${nf(r.delta)}${r.perYear!=null?' · about '+nf(Math.round(r.perYear/100)*100)+' a year':''}${r.flag==='low'?' · unusually low':r.flag==='high'?' · unusually high':''}</small>`;
        }

    }).join('');
  }else html+=note('No readings returned.');
  const cls=(drops||prov)?'t-bad':'t-wn';
  return {html,badge:count?`<span class="${cls}">${count} flag${count>1?'s':''} · </span>`:''};
}

return `<div class="card"><h2>In stock <small>${L.length} car${L.length>1?'s':''}</small></h2>${L.map(x=>`<button class="lb${x.id===c.id?' sel2':''}" data-a="sel" data-id="${x.id}"><b>${esc(x.model)}</b><br><small>${esc(x.reg)} · ${daysHeld(x)} days · ${f(costOf(x))} in</small></button>`).join('')}</div>
<div class="card"><h2>${esc(c.model)} <small>${esc(c.reg)}</small></h2>
<div class="g2">${nfc('bought','Bought (£)')}${nfc('rep','Repairs so far (£)')}${nfc('other','Other costs (£)')}${nfc('listed','Listed price (£)')}${nfc('target','Target profit (£)')}</div><small>Repairs you estimated when you bought: ${f(c.repEst)}</small>
<h2 style="margin-top:14px">Offers</h2>${c.offers.map(o=>`<div class="li"><span>${o[0]} ${f(o[1])}</span><span class="${o[1]-costOf(c)>=c.target?'t-ok':'t-bad'}">${f(o[1]-costOf(c))} profit</span></div>`).join('')||'<small>No offers yet.</small>'}
<div class="r" style="margin-top:8px"><select id="ow" style="width:auto"><option>Buyer offer</option><option>Your counter</option></select><input id="oa" type="number" inputmode="numeric" placeholder="£"><button class="sm" data-a="offer">Log</button></div><small id="oerr" class="t-bad"></small>
<div id="cd" style="margin-top:12px"></div>
<h2>Before you hand over the keys</h2>${PAY.map((p,i)=>`<label class="r" style="font-size:15px;color:var(--tx);margin:6px 0"><input type="checkbox" style="width:auto;margin:0" data-pay="${i}" ${c.pay[i]?'checked':''}>${p}</label>`).join('')}<div id="pw"></div>
<button class="pri" data-a="sold" style="margin:10px 0">Mark sold</button>
<button class="sm" data-a="rm">${rmArm===c.id?'Tap again to remove this car':'Remove car'}</button></div>`}
function updCar(){const c=sCar();if(!c||!$('#cd'))return;const k=costOf(c),fl=k+c.target,cu=curPrice(c),p=cu-k;
$('#cd').innerHTML=(cu>=fl?ban('ok',`${f(cu-fl)} above your lowest price. Profit ${f(p)}.`):ban('bad',`${f(fl-cu)} below your lowest price. Counter at ${f(fl)} or more.`))+mets([['Profit at '+f(cu),f(p),p>=0?'t-ok':'t-bad'],['Lowest you\'d accept',f(fl)]])+`<small>Total cost ${f(k)} including £4 a day holding.</small>`;
$('#pw').innerHTML=c.pay.every(Boolean)?'':'<small>Not all payment checks ticked yet.</small>'}
function vSold(){const L=st.cars.filter(c=>c.soldPrice!=null).sort((a,b)=>b.soldTs-a.soldTs),pr=c=>c.soldPrice-costOf(c);let h='';
if(L.length){const t=L.reduce((s,c)=>s+pr(c),0),d=L.reduce((s,c)=>s+daysHeld(c),0)/L.length,o=L.reduce((s,c)=>s+c.rep-c.repEst,0)/L.length;
h+=mets([['Total profit',f(t),t>=0?'t-ok':'t-bad'],['Cars sold',L.length],['Avg profit per car',f(t/L.length)],['Avg days to sell',Math.round(d)]])+ban(o>0?'wn':'ok',o>0?`Your repair estimates ran ${f(o)} under the real cost per car on average.`:'Your repair estimates are at or under real costs on average.')+'<div class="card">'+L.map(c=>`<div class="li"><span><b>${esc(c.model)}</b><br><small>${esc(c.reg)} · ${f(c.bought)} → ${f(c.soldPrice)} · ${daysHeld(c)} days<br>Repairs: est ${f(c.repEst)}, actual ${f(c.rep)}</small></span><b class="${pr(c)>=0?'t-ok':'t-bad'}">${f(pr(c))}</b></div>`).join('')+'</div>'}
else h+='<div class="card"><small>Sold cars appear here with profit and days to sell.</small></div>';
return h+`<div class="card"><h2>Your account</h2><small>Signed in as ${esc(st.email||'')}. Your data lives in your Supabase project, not this device, so it's the same on your phone and laptop.</small>
<div class="r" style="margin-top:10px"><button class="sm" data-a="export">Export as JSON</button><button class="sm" data-a="logout">Sign out</button></div></div>`}
function setPill(state){const p=$('#savepill');if(!p)return;if(state==='idle'){p.style.display='none';return}p.style.display='';p.className='savepill '+state;p.textContent=state==='pending'?'Saving…':state==='saved'?'Saved':'Save failed — check your connection'}

async function loadAll(){
  const {data,error}=await sb.from('flip_cars').select('*').order('created_at',{ascending:true});
  if(error){ setPill('error'); return; }
  const rows=data||[];
  st.short=rows.filter(r=>r.status==='shortlist').map(r=>({id:r.id,source:r.source,draft:{model:r.model,reg:r.reg,note:r.note||'',mileage:r.mileage==null?'':r.mileage,ask:r.ask==null?'':r.ask,oth:r.other==null?0:r.other,sale:r.sale==null?'':r.sale,tgt:r.target,repairs:r.repairs||[],hammer:r.hammer==null?'':r.hammer,vatIndem:!!r.vat_indem,historyCheck:r.history_check||null,historyCheckedAt:r.history_checked_at||null,valuation:r.valuation||null,valuationAt:r.valuation_at||null},chk:r.checklist||{},fuel:r.fuel||'Petrol',gear:r.gear||'Manual'}));
  st.cars=rows.filter(r=>r.status!=='shortlist').map(r=>({id:r.id,model:r.model,reg:r.reg,bought:r.bought||0,repEst:r.rep_est||0,rep:r.rep||0,other:r.other||0,listed:r.listed||0,target:r.target||0,start:r.start?+new Date(r.start):Date.now(),offers:r.offers||[],soldPrice:r.sold_price,soldTs:r.sold_ts?+new Date(r.sold_ts):null,pay:r.pay||[false,false,false,false]}));
  const {data:nd}=await sb.from('model_notes').select('*');
  st.notes={}; (nd||[]).forEach(n=>{st.notes[n.model]=n.note});
  linkActive();
}
function linkActive(){const x=st.active&&st.short.find(y=>y.id===st.active);if(x){st.draft=x.draft;st.chk=x.chk;st.fuel=x.fuel;st.gear=x.gear}else st.active=null}

function scheduleSave(){setPill('pending');clearTimeout(saveTimer);saveTimer=setTimeout(flushDraftSave,700)}
async function flushDraftSave(){
  clearTimeout(saveTimer);
  const d=st.draft,hasContent=d.model.trim()||d.reg.trim()||d.ask||d.sale;
  if(!hasContent&&!st.active){setPill('idle');return}
  const patch={status:'shortlist',model:d.model.trim(),reg:d.reg.trim().toUpperCase(),note:d.note||'',mileage:d.mileage===''?null:+d.mileage,fuel:st.fuel,gear:st.gear,ask:d.ask===''?null:+d.ask,sale:d.sale===''?null:+d.sale,other:d.oth===''?0:+d.oth,target:d.tgt===''?500:+d.tgt,hammer:d.hammer===''?null:+d.hammer,vat_indem:!!d.vatIndem,repairs:d.repairs,checklist:st.chk,history_check:d.historyCheck,history_checked_at:d.historyCheckedAt,valuation:d.valuation,valuation_at:d.valuationAt};
  try{
    if(st.active){const{error}=await sb.from('flip_cars').update(patch).eq('id',st.active);if(error)throw error}
    else{const{data,error}=await sb.from('flip_cars').insert(patch).select().single();if(error)throw error;st.active=data.id;st.short.push({id:data.id,source:'manual',draft:st.draft,chk:st.chk,fuel:st.fuel,gear:st.gear})}
    setPill('saved');
  }catch(e){setPill('error')}
}
async function flushNow(){clearTimeout(saveTimer);await flushDraftSave()}

async function openDeal(id){histErr='';valErr='';await flushNow();const x=st.short.find(y=>y.id===id);if(!x)return;st.active=id;st.draft=x.draft;st.chk=x.chk;st.fuel=x.fuel;st.gear=x.gear}
async function newDeal(){histErr='';valErr='';await flushNow();st.active=null;st.draft=blankDraft();st.chk={};st.fuel='Petrol';st.gear='Manual'}

let noteTimer=null;
function scheduleNote(model,text){clearTimeout(noteTimer);noteTimer=setTimeout(()=>saveNote(model,text),700)}
async function saveNote(model,text){if(!model)return;try{setPill('pending');await sb.from('model_notes').upsert({model,note:text},{onConflict:'user_id,model'});setPill('saved')}catch(e){setPill('error')}}

let stockTimer=null;
function scheduleStockSave(c){setPill('pending');clearTimeout(stockTimer);stockTimer=setTimeout(()=>saveStockCar(c),500)}
async function saveStockCar(c){try{const{error}=await sb.from('flip_cars').update({bought:c.bought,rep_est:c.repEst,rep:c.rep,other:c.other,listed:c.listed,target:c.target}).eq('id',c.id);if(error)throw error;setPill('saved')}catch(e){setPill('error')}}
async function saveStockNow(c,extra){try{setPill('pending');const{error}=await sb.from('flip_cars').update(Object.assign({offers:c.offers,pay:c.pay},extra||{})).eq('id',c.id);if(error)throw error;setPill('saved')}catch(e){setPill('error')}}

async function doLookup(){
  const reg=st.draft.reg.trim().replace(/\s+/g,'');
  if(!reg){lookupMsg='Enter a reg plate first.';render();return}
  lookupBusy=true;lookupMsg='';render();
  try{
    const{data:{session}}=await sb.auth.getSession();
    const res=await fetch(`${SUPABASE_URL}/functions/v1/lookup-reg`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({reg})});
    const out=await res.json();
    if(!res.ok){lookupMsg=out.error||'Lookup failed.';return}
    const bits=[];
    if(out.dvla&&out.dvla.configured===false)bits.push('DVLA lookup not set up yet.');
    else if(out.dvla&&out.dvla.found){
      if(!st.draft.model.trim()){const cc=out.dvla&&out.dvla.engineCC,litres=cc?(Math.round(cc/100)/10).toFixed(1):'',parts=[out.dvla&&out.dvla.make,out.dvsa&&out.dvsa.model,litres].filter(Boolean);if(parts.length)st.draft.model=parts.join(' ')}
      bits.push(`DVLA: ${[out.dvla.make,out.dvla.colour].filter(Boolean).join(' ')}, MOT ${out.dvla.motStatus||'unknown'}`);
    } else if(out.dvla&&out.dvla.found===false)bits.push('DVLA: no record for that plate.');
    if(out.dvsa&&out.dvsa.configured===false)bits.push('MOT history lookup not set up yet.');
    else if(out.dvsa&&out.dvsa.found){
      const adv=(out.dvsa.tests||[]).flatMap(t=>t.advisories||[]);
      if(!st.draft.mileage&&out.dvsa.tests&&out.dvsa.tests.length&&out.dvsa.tests[0].mileage!=null)st.draft.mileage=String(out.dvsa.tests[0].mileage);
      if(out.dvsa.mileageDrop){const c=ck('s1-0');c.s='issue';c.n='Mileage history shows a drop between tests — check carefully.'}
      let addedCount=0;
      const latestAdv=(out.dvsa.tests&&out.dvsa.tests[0]&&out.dvsa.tests[0].advisories)||[];
      if(latestAdv.length){
        const existing=new Set(st.draft.repairs.map(r=>r.n));
        latestAdv.forEach(a=>{
          const short=shortAdvisory(a);
          if(short&&!existing.has(short)){st.draft.repairs.push({n:short,a:0});existing.add(short);addedCount++}
        });
      }
      bits.push(addedCount?`MOT: ${addedCount} issue${addedCount>1?'s':''} added to repairs — set a price for each.`:adv.length?`MOT: ${adv.length} issue${adv.length>1?'s':''} on record.`:'MOT: no issues on recent tests.');
    } else if(out.dvsa&&out.dvsa.found===false)bits.push('MOT: no history found for that plate.');
    lookupMsg=bits.length?bits.join(' · '):'No extra details came back for that plate.';
    scheduleSave();
  }catch(e){lookupMsg="Couldn't reach the lookup service. Check your connection.";}
  finally{lookupBusy=false;render()}
}

function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#app').innerHTML={check:vCheck,auction:vAuction,history:vHistory,viewing:vView,stock:vStock,sold:vSold}[tab]();if(tab==='check')updCheck();if(tab==='auction')updAuc();if(tab==='history'){updHistFull();updValFull()}if(tab==='viewing')updChk();if(tab==='stock')updCar()}
const msg=(t,c)=>{const e=$('#cmsg');if(e){e.textContent=t;e.className=c}};

$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const v=b.dataset.v;
switch(b.dataset.a){
case'lookup':await doLookup();return;
case'viewhist':tab='history';render();window.scrollTo(0,0);return;
case'viewval':{tab='history';render();const v=$('#valfull');if(v&&v.scrollIntoView)v.scrollIntoView();else window.scrollTo(0,0);return}
case'runval':{
  if(valuationBusy)return;
  const reg=st.draft.reg.trim().replace(/\s+/g,''),mi=+st.draft.mileage||0;
  if(!reg||!mi)return;
  valuationBusy=true;valErr='';render();
  let out=null;
  try{
    const{data:{session}}=await sb.auth.getSession();
    const res=await fetch(`${SUPABASE_URL}/functions/v1/valuation`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({reg,mileage:mi})});
    let body=null;try{body=await res.json()}catch(x){}
    if(res.ok&&body&&body.found===true)out=body;
    else if(body&&body.configured===false)valErr="Valuation isn't set up on the server yet.";
    else if(body&&body.found===false&&!body.error)valErr='No valuation available for that plate.';
    else valErr=(body&&(body.error||body.message))||('Service error '+res.status);
  }catch(e){valErr="Couldn't reach the service. Check the valuation function is deployed."}
  if(out){st.draft.valuation=out;st.draft.valuationAt=new Date().toISOString()}
  valuationBusy=false;render();
  if(out)await flushNow();
  return;
}
case'runhist':{
  if(historyBusy)return;
  const reg=st.draft.reg.trim().replace(/\s+/g,'');
  if(!reg)return;
  if(!confirm('This runs the finance, stolen, write-off and mileage checks and costs £1.84. Continue?'))return;
  historyBusy=true;histErr='';render();
  let out=null;
  try{
    const{data:{session}}=await sb.auth.getSession();
    const res=await fetch(`${SUPABASE_URL}/functions/v1/history-check`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({reg})});
    let body=null;try{body=await res.json()}catch(x){}
    if(res.ok&&body&&body.found===true)out=body;
    else if(body&&body.configured===false)histErr="History check isn't set up on the server yet.";
    else if(body&&body.found===false&&!body.error)histErr='No history record found for that plate.';
    else histErr=(body&&(body.error||body.message))||('Service error '+res.status);
  }catch(e){histErr="Couldn't reach the service. Check the history-check function is deployed."}
  // Only a genuine result is saved. A failure never overwrites one you already paid for.
  if(out){st.draft.historyCheck=out;st.draft.historyCheckedAt=new Date().toISOString()}
  historyBusy=false;render();
  if(out)await flushNow();
  return;
}
case'useAuc':{const h=+st.draft.hammer||0,idm=indemFor(h);if(!h||idm==null)return;const vatH=h*.2,vatI=st.draft.vatIndem?idm*.2:0,r2=x=>Math.round(x);st.draft.ask=String(r2(h+vatH));st.draft.oth=String(r2(idm+vatI));scheduleSave();tab='check';render();window.scrollTo(0,0);return}
case'addrep':{const n=$('#rn').value.trim(),a=parseFloat($('#ra').value);if(!n||!(a>=0)){$('#rerr').textContent='Enter a repair name and amount first.';return}st.draft.repairs.push({n,a});$('#rn').value='';$('#ra').value='';$('#rerr').textContent='';scheduleSave();updCheck();return}
case'delrep':st.draft.repairs.splice(+b.dataset.i,1);scheduleSave();updCheck();return;
case'adddelivery':st.draft.repairs.push({n:'Delivery',a:80});scheduleSave();updCheck();return;
case'buy':{const d=st.draft,c=calc(d);if(!d.model.trim()||!c.ask){$('#berr').textContent='Add the model and asking price first.';return}
await flushNow();
const patch={status:'stock',model:d.model.trim(),reg:d.reg.trim().toUpperCase(),mileage:d.mileage===''?null:+d.mileage,bought:c.ask,rep_est:c.rep,rep:c.rep,other:+d.oth||0,listed:c.sale,target:+d.tgt||0,start:new Date().toISOString(),offers:[],sold_price:null,sold_ts:null,pay:[false,false,false,false]};
try{
  let id;
  if(st.active){const{data,error}=await sb.from('flip_cars').update(patch).eq('id',st.active).select().single();if(error)throw error;id=data.id;st.short=st.short.filter(x=>x.id!==st.active)}
  else{const{data,error}=await sb.from('flip_cars').insert(patch).select().single();if(error)throw error;id=data.id}
  st.cars.push({id,model:patch.model,reg:patch.reg,bought:patch.bought,repEst:patch.rep_est,rep:patch.rep,other:patch.other,listed:patch.listed,target:patch.target,start:Date.now(),offers:[],soldPrice:null,soldTs:null,pay:[false,false,false,false]});
  st.active=null;st.draft=blankDraft();st.chk={};st.fuel='Petrol';st.gear='Manual';selId=id;tab='stock';setPill('saved');render();
}catch(err){$('#berr').textContent="Couldn't save that — check your connection and try again."}
return}
case'newdeal':await newDeal();render();window.scrollTo(0,0);return;
case'opensl':await openDeal(b.dataset.id);render();return;
case'rmsl':{if(!st.active)return;if(slArm===st.active){const id=st.active;try{await sb.from('flip_cars').delete().eq('id',id)}catch(err){}st.short=st.short.filter(x=>x.id!==id);st.active=null;st.draft=blankDraft();st.chk={};st.fuel='Petrol';st.gear='Manual';slArm=0}else slArm=st.active;render();return}
case'sec':open[v]=!open[v];render();return;
case'fuel':st.fuel=v;scheduleSave();render();return;
case'gear':st.gear=v;scheduleSave();render();return;
case'set':{const c=ck(b.dataset.k);c.s=c.s===v?'':v;scheduleSave();render();return}
case'rstchk':st.chk={};if(st.active){const x=st.short.find(y=>y.id===st.active);if(x)x.chk=st.chk}scheduleSave();render();return;
case'chk2rep':{const ls=secs().flatMap(s=>s.it).filter(i=>ck(i.k).s==='issue'&&!ck(i.k).sent&&(+ck(i.k).c||0)>0);if(!ls.length){msg('Mark an issue and enter its fix cost first.','t-bad');return}
ls.forEach(i=>{const c=ck(i.k);c.sent=true;st.draft.repairs.push({n:i.t+(c.n?': '+c.n:''),a:+c.c})});scheduleSave();tab='check';render();return}
case'sel':selId=b.dataset.id;rmArm=0;render();return;
case'offer':{const c=sCar(),a=parseFloat($('#oa').value);if(!(a>0)){$('#oerr').textContent='Enter an offer amount first.';return}c.offers.push([$('#ow').value,a]);render();await saveStockNow(c);return}
case'sold':{const c=sCar();c.soldPrice=curPrice(c);c.soldTs=Date.now();render();await saveStockNow(c,{status:'sold',sold_price:c.soldPrice,sold_ts:new Date(c.soldTs).toISOString()});return}
case'rm':{const c=sCar();if(rmArm===c.id){try{await sb.from('flip_cars').delete().eq('id',c.id)}catch(err){}st.cars=st.cars.filter(x=>x.id!==c.id);rmArm=0}else rmArm=c.id;render();return}
case'export':{const blob=new Blob([JSON.stringify({short:st.short,cars:st.cars},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carflip-export-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();return}
case'logout':await flushNow();await sb.auth.signOut();location.reload();return;
}});

$('#app').addEventListener('input',e=>{const t=e.target,d=t.dataset;
if(d.d!==undefined){st.draft[d.d]=t.type==='checkbox'?t.checked:t.value;if(tab==='auction')updAuc();else{updCheck();scheduleSave()}}
else if(d.c!==undefined){ck(d.c).c=t.value;updChk();scheduleSave()}
else if(d.n!==undefined){ck(d.n).n=t.value;scheduleSave()}
else if(d.rep!==undefined){st.draft.repairs[+d.rep].a=+t.value||0;updCheck();scheduleSave()}
else if(d.repn!==undefined){st.draft.repairs[+d.repn].n=t.value;scheduleSave()}
else if(d.cf!==undefined){const c=sCar();c[d.cf]=+t.value||0;updCar();scheduleStockSave(c)}
else if(d.note!==undefined){st.notes[st.draft.model||'_']=t.value;scheduleNote(st.draft.model||'_',t.value)}});

$('#app').addEventListener('change',async e=>{const t=e.target;
if(t.id==='sw'){if(t.value&&t.value!=='0'){await openDeal(t.value);render()}return}
const p=t.dataset.pay;if(p!==undefined){const c=sCar();c.pay[+p]=t.checked;updCar();await saveStockNow(c)}});

document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;rmArm=0;slArm=0;render();window.scrollTo(0,0)});

// ---------- Auth ----------
async function showApp(){$('#gate').style.display='none';$('#main').style.display='';setPill('pending');await loadAll();setPill('idle');render()}
async function checkSession(){if(!sb)return;const{data:{session}}=await sb.auth.getSession();if(session)await showApp()}
$('#login').addEventListener('click',async()=>{
  if(!sb)return;$('#gateerr').textContent='';
  const{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#pw').value});
  if(error){$('#gateerr').textContent=error.message;return}
  st.email=$('#email').value;await showApp();
});
$('#pw')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('#login').click()});
checkSession();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
